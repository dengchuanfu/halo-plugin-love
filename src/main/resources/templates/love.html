<!doctype html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index,follow" />
    <title th:text="|${couple.headline()} - ${site.title}|">情侣主页</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Noto Sans", "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-width: 320px; width: 100%; height: 100%; overflow: hidden; }
      body {
        color: #252020;
        background-color: #fff;
        background-image: linear-gradient(to right, rgba(37, 82, 110, .10) 1px, transparent 1px), linear-gradient(to bottom, rgba(37, 82, 110, .10) 1px, transparent 1px);
        background-size: 24px 24px;
      }

      main { width: 100%; height: 100svh; min-height: 100vh; overflow: hidden; }
      .bg-wrap { position: relative; height: 60svh; min-height: 0; overflow: hidden; }
      .bg-img {
        position: relative;
        height: 100%;
        min-height: 0;
        padding: clamp(30px, 7vh, 82px) 20px 0;
        background-image: linear-gradient(rgba(39, 67, 49, .16), rgba(39, 67, 49, .16)), var(--wallpaper-image);
        background-color: #adc3af;
        background-position: center top;
        background-size: cover;
      }
      .bg-img::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .22; background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAABmJLR0QA/wD/AP+gvaeTAAAABmJLR0QA/wD/AP+gvaeTAAAADUlEQVQImWNgYGD4DwABBAEAHf9aNwAAAABJRU5ErkJggg=="); }

      .central { width: min(100%, 940px); margin: 0 auto; position: relative; z-index: 1; }
      .middle {
        display: flex;
        align-items: center;
        justify-content: space-around;
        gap: clamp(20px, 8vw, 100px);
        width: min(100%, 720px);
        height: min(38svh, 320px);
        min-height: 0;
        margin: 0 auto;
        padding: 34px 40px 30px;
        border: 1px solid rgba(255, 255, 255, .32);
        border-radius: 58px;
        background: rgba(207, 207, 207, .66);
        box-shadow: 0 18px 44px rgba(38, 54, 42, .16), inset 0 1px rgba(255, 255, 255, .38);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        user-select: none;
      }
      .person { width: 160px; text-align: center; }
      .avatar-link { display: block; width: fit-content; margin: 0 auto; border-radius: 50%; }
      .avatar-link:focus-visible { outline: 3px solid rgba(255, 255, 255, .9); outline-offset: 4px; }
      .person img.avatar { display: block; width: clamp(108px, 11vw, 140px); height: clamp(108px, 11vw, 140px); margin: 0 auto 12px; border: 4px solid rgba(255,255,255,.95); border-radius: 50%; object-fit: cover; box-shadow: 0 5px 18px rgba(47, 58, 47, .16); }
      .avatar-link .avatar { transition: transform .2s ease, box-shadow .2s ease; }
      .avatar-link:hover .avatar { transform: translateY(-3px) scale(1.025); box-shadow: 0 9px 22px rgba(47, 58, 47, .24); }
      .person span { display: block; overflow: hidden; color: #fff; text-overflow: ellipsis; white-space: nowrap; font-size: clamp(21px, 2.3vw, 28px); font-weight: 700; letter-spacing: .04em; text-shadow: 0 2px 5px rgba(48, 48, 40, .42); }

      .love-icon { display: grid; width: 54px; height: 54px; place-items: center; flex: 0 0 auto; border: 1px solid rgba(207, 77, 111, .42); border-radius: 50%; background: rgba(207, 77, 111, .14); color: #cf4d6f; box-shadow: 0 3px 10px rgba(207, 77, 111, .18); transform-origin: center; animation: love-heart-beat 1.35s ease-in-out infinite; }
      .love-icon svg { width: 27px; height: 27px; fill: currentColor; }
      @keyframes love-heart-beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.16); } 28% { transform: scale(1); } 42% { transform: scale(1.09); } }

      .waves { position: absolute; right: 0; bottom: -1px; left: 0; width: 100%; height: clamp(72px, 8vw, 120px); margin: 0; }
      .waves .parallax > use { animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite; }
      .waves .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; }
      .waves .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; }
      .waves .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; }
      .waves .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; }
      @keyframes move-forever { 0% { transform: translate3d(-90px, 0, 0); } 100% { transform: translate3d(85px, 0, 0); } }

      .time { position: relative; z-index: 1; height: 32svh; min-height: 0; padding: clamp(14px, 4vh, 42px) 20px 12px; text-align: center; }
      .time-caption { display: block; margin-bottom: 17px; font-size: clamp(27px, 3.2vw, 42px); font-weight: 700; background-image: linear-gradient(90deg, #60ebad, #ffd000, #ff79b0, #60ebad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: gradient-shift 8s linear infinite; background-size: 300% 100%; }
      .timer { display: flex; justify-content: center; align-items: baseline; flex-wrap: wrap; gap: 0 16px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: clamp(28px, 4vw, 48px); font-weight: 700; font-variant-numeric: tabular-nums; }
      .timer b { font-size: clamp(40px, 6vw, 68px); }
      .timer small { margin-left: 4px; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: .56em; font-weight: 400; }
      .message { width: min(100%, 680px); margin: clamp(12px, 2.2vh, 22px) auto 0; color: #8a8f98; font-size: clamp(14px, 1.6vw, 18px); line-height: 1.75; white-space: pre-line; }
      @keyframes gradient-shift { to { background-position: -300% 0; } }

      @media (max-width: 700px) {
        .bg-wrap { height: 56svh; }
        .bg-img { padding: 24px 12px 0; }
        .middle { height: min(31svh, 236px); padding: 20px 10px 18px; border-radius: 30px; gap: 3px; }
        .person { width: 34vw; }
        .person img.avatar { width: 23vw; height: 23vw; min-width: 78px; min-height: 78px; margin-bottom: 9px; }
        .person span { font-size: 18px; }
        .love-icon { width: 42px; height: 42px; }
        .love-icon svg { width: 21px; height: 21px; }
        .time { height: 44svh; padding: 18px 12px 8px; }
        .timer { gap: 2px 8px; }
        .message { margin-top: 12px; font-size: 14px; }
      }
    </style>
  </head>
  <body>
    <main th:style="|--wallpaper-image: url('${coverImage}')|">
      <div class="bg-wrap">
        <section class="bg-img" aria-label="情侣头像">
          <div class="central">
            <div class="middle">
              <div class="person">
                <a class="avatar-link" th:if="${not #strings.isEmpty(leftProfileUrl)}" th:href="${leftProfileUrl}" target="_blank" rel="noopener noreferrer" th:aria-label="|打开 ${couple.left_name()} 的链接|"><img class="avatar" th:src="${leftAvatar}" th:alt="${couple.left_name()} + ' 的头像'" /></a>
                <img class="avatar" th:unless="${not #strings.isEmpty(leftProfileUrl)}" th:src="${leftAvatar}" th:alt="${couple.left_name()} + ' 的头像'" />
                <span th:text="${couple.left_name()}">我们</span>
              </div>
              <div class="love-icon" aria-label="相爱">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m8 14.25-.1-.1C3.7 10.4 1 8.1 1 5.3 1 3.2 2.7 1.5 4.8 1.5c1.2 0 2.4.6 3.2 1.5.8-.9 2-1.5 3.2-1.5C13.3 1.5 15 3.2 15 5.3c0 2.8-2.7 5.1-6.9 8.85l-.1.1Z"></path></svg>
              </div>
              <div class="person">
                <a class="avatar-link" th:if="${not #strings.isEmpty(rightProfileUrl)}" th:href="${rightProfileUrl}" target="_blank" rel="noopener noreferrer" th:aria-label="|打开 ${couple.right_name()} 的链接|"><img class="avatar" th:src="${rightAvatar}" th:alt="${couple.right_name()} + ' 的头像'" /></a>
                <img class="avatar" th:unless="${not #strings.isEmpty(rightProfileUrl)}" th:src="${rightAvatar}" th:alt="${couple.right_name()} + ' 的头像'" />
                <span th:text="${couple.right_name()}">彼此</span>
              </div>
            </div>
          </div>
          <svg class="waves" viewBox="0 24 150 28" preserveAspectRatio="none" aria-hidden="true">
            <defs><path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18 58 18 88 18v44h-352z" /></defs>
            <g class="parallax">
              <use href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,.70)" />
              <use href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,.50)" />
              <use href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,.30)" />
              <use href="#gentle-wave" x="48" y="7" fill="#fff" />
            </g>
          </svg>
        </section>
      </div>
      <section class="time" id="timer" th:attr="data-start=${couple.started_at()}" aria-live="polite">
        <span class="time-caption">这是我们一起走过的</span>
        <div class="timer">
          <span><b data-unit="days">0</b><small>天</small></span>
          <span><b data-unit="hours">0</b><small>时</small></span>
          <span><b data-unit="minutes">0</b><small>分</small></span>
          <span><b data-unit="seconds">0</b><small>秒</small></span>
        </div>
        <p class="message" th:text="${couple.message()}">愿每一个平常的日子，都有彼此相伴。</p>
      </section>
    </main>
    <script>
      (function () {
        var timer = document.getElementById('timer');
        var start = new Date(timer.dataset.start + 'T00:00:00');
        if (Number.isNaN(start.getTime())) return;
        function update() {
          var diff = Math.max(0, Date.now() - start.getTime());
          var values = { days: Math.floor(diff / 86400000), hours: Math.floor(diff / 3600000) % 24, minutes: Math.floor(diff / 60000) % 60, seconds: Math.floor(diff / 1000) % 60 };
          Object.keys(values).forEach(function (unit) { var node = timer.querySelector('[data-unit="' + unit + '"]'); if (node) node.textContent = String(values[unit]); });
        }
        update();
        window.setInterval(update, 1000);
      })();
    </script>
  </body>
</html>
